XBotInterface:
  urdf: xacro $(ros2 pkg prefix --share hhcm_actuator_calibration)/urdf/calib_setup.urdf.xacro load_mass:=${LOAD_MASS-0} load_radius:=${LOAD_RADIUS:-0} motor_type:=${MOTOR_TYPE:-small_30}
  srdf: xacro $(ros2 pkg prefix --share hhcm_actuator_calibration)/srdf/calib_setup.srdf.xacro


# hal
xbotcore_device_configs:
  ec_idle: /home/user/xbot2_ws/src/hhcm_actuator_calibration/config/hal/ec_all.yaml
  ec_pos: /home/user/xbot2_ws/src/hhcm_actuator_calibration/config/hal/ec_all.yaml


# threads
xbotcore_threads:
    rt_main:  {sched: fifo , prio: 60, period: 0.001, core_id: 3}
    nrt_main: {sched: other, prio: 0 , period: 0.005}
    main: {sched: other, prio: 0 , period: 0.005, main: true, core_id: 5}


# plugins
xbotcore_plugins:

  homing:
    thread: rt_main
    type: homing

  ros_io:
    thread: main
    type: ros2_io
    params:
      publish_tf: true
      publish_ros_joint_states: false

  ros_control: {thread: nrt_main, type: ros2_control}

  trj:
    type: data_collection_plugin_haotian
    thread: rt_main
    params:
      amplitude: 
        j_motor: 1.0
      freq_min: 0.1
      freq_max: 1.0
      period: 10.0
      stop_time: 20.0
      enable_log: true
      log_file: /tmp/trajectory_log_haotian
      trj_out: Position  # Torque

  # 策略式目标：独立插件，与 trj 互不影响；用 `xbot2 plugin switch trj_policy 1` 启动。
  # 不要和 trj 同时打开。阈值为 0 时 on_start 拒绝启动，但不影响 xbot2-core 和其他插件加载。
  trj_policy:
    type: policy_trajectory_plugin_haotian
    thread: rt_main
    params:
      joint: j_motor
      amplitude: 0.3              # A，目标相对 q0 的最大偏移，输出端 rad。可在线调。
      policy_rate_hz: 50.0        # 与 RL 策略的控制频率一致；目标在两次更新之间保持不变。
      max_step: 0.05              # 相邻两次目标的最大变化 rad；max_step*policy_rate_hz 不能超过 max_velocity。
      max_ref_rate: 8.0           # 下发参考的最大变化率 rad/s；须 < 20（XBot2 HAL 的 d(pos_ref)/dt 限制，按实际周期计算，留足抖动余量），且 >= max_step*policy_rate_hz。
      step_probability: 0.4       # 用阶跃到达下一个航点的概率，其余用线性斜坡。
      dwell_min: 0.2              # 航点停留时间范围 s；停留时带载保持，产生"误差大、速度小"的样本。
      dwell_max: 1.5
      ramp_min: 0.1               # 斜坡用时范围 s，决定跟踪段的速度分布。
      ramp_max: 1.0
      warmup_time: 5.0            # 开头/结尾幅值渐入渐出 s。
      seed: 0.0                   # 随机种子；每次实验换一个，可在线调。
      stop_time: 60.0             # 整段时长 s，含两端过渡。可在线调。
      position_min: -1.5707963267948966
      position_max: 1.5707963267948966
      max_velocity: 3.0           # 输出 rad/s 上限，同时用于实测速度检查；须 >= max_step*policy_rate_hz = 2.5。
      max_link_torque: 30.0       # 输出端力矩传感器 N·m 阈值；按配重重力矩 m*g*r 留余量，远低于约 100 N·m 的饱和。
      max_tracking_error: 0.3     # |q - 目标| 阈值 rad，含目标阶跃本身（最多 max_step）和跟踪滞后。
      disable_reference_filter: true  # 实验期间关闭 joint_safety 参考滤波，结束后恢复（与 trj 相同）。
      enable_log: true
      log_file: /tmp/policy_targets

  # 与 trj 参数相同的扫频正弦，但不给速度前馈（速度参考置 0）；独立插件，不影响 trj。
  # 用 `xbot2 plugin switch trj_chirp 1` 启动，不要和 trj 同时打开。
  trj_chirp:
    type: chirp_trajectory_plugin_haotian
    thread: rt_main
    params:
      amplitude: 
        j_motor: 1.0
      freq_min: 0.1
      freq_max: 1.0
      period: 10.0
      stop_time: 20.0
      enable_log: true
      log_file: /tmp/trajectory_log_chirp_zero_vel
      trj_out: Position  # Torque


# global parameters
xbotcore_param:
  /xbot/hal/joint_safety/filter_autostart: false
  /xbot/hal/joint_safety/filter_cutoff_hz: 2.0






