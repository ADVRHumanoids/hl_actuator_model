XBotInterface:
  urdf: xacro $(ros2 pkg prefix --share hhcm_actuator_calibration)/urdf/calib_setup.urdf.xacro load_mass:=${LOAD_MASS-0} load_radius:=${LOAD_RADIUS:-0} motor_type:=${MOTOR_TYPE:-small_30}
  srdf: xacro $(ros2 pkg prefix --share hhcm_actuator_calibration)/srdf/calib_setup.srdf.xacro


# hal
xbotcore_device_configs:
  ec_idle: /home/user/xbot2_ws/src/hhcm_actuator_calibration/config/hal/ec_all.yaml
  ec_pos: /home/user/xbot2_ws/src/hhcm_actuator_calibration/config/hal/ec_all.yaml


# threads
xbotcore_threads:
    rt_main:  {sched: fifo , prio: 60, period: 0.001, core_id: 3}
    nrt_main: {sched: other, prio: 0 , period: 0.005}
    main: {sched: other, prio: 0 , period: 0.005, main: true, core_id: 5}


# plugins
xbotcore_plugins:

  homing:
    thread: rt_main
    type: homing

  ros_io:
    thread: main
    type: ros2_io
    params:
      publish_tf: true
      publish_ros_joint_states: false

  ros_control: {thread: nrt_main, type: ros2_control}

  trj:
    type: data_collection_plugin_haotian
    thread: rt_main
    params:
      amplitude: 
        j_motor: 1.0
      freq_min: 0.1
      freq_max: 1.0
      period: 10.0
      stop_time: 20.0
      enable_log: true
      log_file: /tmp/trajectory_log_haotian
      trj_out: Position  # Torque

  # 策略式目标：独立插件，与 trj 互不影响；用 `xbot2 plugin switch trj_policy 1` 启动。
  # 不要和 trj 同时打开。阈值为 0 时 on_start 拒绝启动，但不影响 xbot2-core 和其他插件加载。
  trj_policy:
    type: policy_trajectory_plugin_haotian
    thread: rt_main
    params:
      joint: j_motor
      amplitude: 0.3              # A，目标相对 q0 的最大偏移，输出端 rad。可在线调。
      policy_rate_hz: 50.0        # 与 RL 策略的控制频率一致；目标在两次更新之间保持不变。
      max_step: 0.05              # 相邻两次目标的最大变化 rad；max_step*policy_rate_hz 不能超过 max_velocity。
      max_ref_rate: 8.0           # 下发参考的最大变化率 rad/s；须 < 20（XBot2 HAL 的 d(pos_ref)/dt 限制，按实际周期计算，留足抖动余量），且 >= max_step*policy_rate_hz。
      step_probability: 0.4       # 用阶跃到达下一个航点的概率，其余用线性斜坡。
      dwell_min: 0.2              # 航点停留时间范围 s；停留时带载保持，产生"误差大、速度小"的样本。
      dwell_max: 1.5
      ramp_min: 0.1               # 斜坡用时范围 s，决定跟踪段的速度分布。
      ramp_max: 1.0
      warmup_time: 5.0            # 开头/结尾幅值渐入渐出 s。
      seed: 0.0                   # 随机种子；每次实验换一个，可在线调。
      stop_time: 60.0             # 总时长 s，含两端过渡；插探测段时按整段向上取整。温升实验设成足够长（如 7200），由温度停机线结束。可在线调。
      position_min: -1.5707963267948966
      position_max: 1.5707963267948966
      max_velocity: 3.0           # 输出 rad/s 上限，同时用于实测速度检查；须 >= max_step*policy_rate_hz = 2.5。
      max_link_torque: 30.0       # 输出端力矩传感器 N·m 阈值；按配重重力矩 m*g*r 留余量，远低于约 100 N·m 的饱和。
                                  # 过载实验要调高，但不能超过 peak_torque。
      # 温升 / 过载实验。力矩都是输出端 N·m（与 tau_link、tau_mot 同单位），按数据手册填；
      # rated_torque、peak_torque、stop_motor_temperature 为 0 时 on_start 拒绝启动。
      # 电机手册：额定 1.76 Nm / 13.6 A，峰值 4.95 Nm / 38.6 A，Kt 0.129 Nm/A；减速比 50，未计效率（与 tau_mot 的算法一致）。
      # 之后测 20:1 的那台时改成 rated_torque 35.2、peak_torque 99。
      rated_torque: 88.0          # 额定（连续）力矩 = 1.76 × 50；状态行统计 |tau_mot| 超过它的时间比例。
      peak_torque: 247.5          # 峰值力矩 = 4.95 × 50；max_link_torque 不能超过它。减速器、力矩传感器的额定/量程若更小，以较小者为准。
      stop_motor_temperature: 70.0  # 电机温度停机线 °C（暂定，用户 2026-11-16 给定；绕组上限查到后再调）；连续 0.5 s 达到就停（THERMAL STOP）。
      stop_driver_temperature: 0.0      # 驱动器温度停机线 °C，0 表示不检查。
      max_start_motor_temperature: 0.0  # 启动时电机温度上限 °C（如环境温度 + 3），保证每档从冷态开始；0 表示不检查。
      probe_duration: 0.0         # 探测段时长 s，0 = 不插（与原来的单段序列相同）。温升实验建议 30。可在线调。
      heat_duration: 300.0        # 两次探测之间的加热段时长 s。可在线调。
      probe_seed: 1000.0          # 探测段种子：每次探测的目标序列完全相同，用来比较不同温度下的响应。
      status_period: 10.0         # 每隔多少秒打印一次温度、tau_mot RMS 和超额定时间比例。
      # |q - q_ref| 阈值 rad。驱动器 tau = 98.7*(q_ref - q) - 9.6*v（阻尼作用于实测速度，无速度前馈），
      # 阶跃目标按 max_step*policy_rate_hz = 2.5 rad/s 爬升时，稳态滞后 (9.6*2.5 + 4.9 摩擦 + 1.2*2.5)/98.7 ≈ 0.32 rad，
      # 带载再加 m*g*r/98.7（3.5 kg @ 0.3 m 约 0.1 rad）。原来的 0.3 让 2026-11-17 的 12 次 policy 全部在阶跃段停下。
      max_tracking_error: 0.6
      disable_reference_filter: true  # 实验期间关闭 joint_safety 参考滤波，结束后恢复（与 trj 相同）。
      enable_log: true
      log_file: /tmp/policy_targets

  # 与 trj 参数相同的扫频正弦，但不给速度前馈（速度参考置 0）；独立插件，不影响 trj。
  # 用 `xbot2 plugin switch trj_chirp 1` 启动，不要和 trj 同时打开。
  trj_chirp:
    type: chirp_trajectory_plugin_haotian
    thread: rt_main
    params:
      amplitude: 
        j_motor: 1.0
      freq_min: 0.1
      freq_max: 1.0
      period: 10.0
      stop_time: 20.0
      enable_log: true
      log_file: /tmp/trajectory_log_chirp_zero_vel
      trj_out: Position  # Torque
      # 安全检查（每项 > 0 时生效；越限时打印 SAFETY STOP trj_chirp 并停止插件）。
      # 按幅值 1 rad、1 Hz 估计：峰值速度约 6.3 rad/s；无速度前馈时跟踪滞后约 0.65 rad。
      position_min: -1.5707963267948966
      position_max: 1.5707963267948966
      max_velocity: 8.0
      max_link_torque: 30.0
      max_tracking_error: 1.0
      stop_motor_temperature: 70.0  # 电机温度停机线 °C（暂定，同 trj_policy）；连续 0.5 s 达到就停（THERMAL STOP）。删掉这一行则不检查。


  # 水平小幅扫频（与 trj_chirp 同一插件类型，side = ±1）：从当前位置（homing，垂直向下）平滑移到水平位置 hang_position + side·π/2，
  # 停稳并修正到实际水平，绕水平位置扫频 stop_time 秒（最后 fade_time 秒幅值平滑降到 0），再平滑回到起点，自动停止。
  # 用法：./run_trj.sh trj_horizontal side=1 j_motor/amplitude=0.26 stop_time=60 log_file=/tmp/chirp_hpos_m7_A026
  # side 和幅值、频率、时长都在启动命令里改；不要和其他轨迹插件同时打开。从配重自然下垂的位置启动。
  trj_horizontal:
    type: chirp_trajectory_plugin_haotian
    thread: rt_main
    params:
      side: 1.0                   # +1 / -1：水平位置在下垂角度的正方向 / 负方向（哪边是左右按台架安装看）。
      hang_position: 0.0          # 配重自然下垂的角度 rad（11-17 静态测试 -0.023，11-18 拟合约 0）。
      amplitude:
        j_motor: 0.26             # 扫频幅值 rad：10° = 0.17，15° = 0.26，20° = 0.35。
      freq_min: 0.1
      freq_max: 1.0
      period: 10.0                # 频率 freq_min → freq_max → freq_min 一个来回的时长 s。
      stop_time: 60.0             # 扫频时长 s（不含过渡和停稳），必须 > 0。
      fade_time: 3.0              # 扫频最后几秒幅值平滑降到 0，回到中心再返回起点。
      settle_time: 3.0            # 到水平位置后至少停稳 s。
      # 中心修正：驱动器位置环没有积分，水平托住配重时实际角度比参考差 重力矩/Kp + 静摩擦（7 kg 约 12–20°）。
      # 停稳阶段按实测角度积分出参考偏移，实际角度在 correction_tolerance 内保持 1 s 后才开始扫频，扫频绕修正后的参考进行。
      center_correction: true
      correction_gain: 0.5        # 1/s，7 kg 约 8 s 到位（离线模型）；台架上抖动就调小。
      correction_tolerance: 0.01  # rad（约 0.6°）
      max_correction: 1.0         # 参考偏移上限 rad；1 m 摆臂托举 40–70 N·m 时偏移 0.5–0.9 rad（11-23），顶到它时 max_hold_torque 检查会停止
      max_settle_time: 30.0       # 到时还没到位也开始扫频（打印 NOT settled）
      # 扫频中继续慢速修正中心：停稳得到的偏移含单向静摩擦，扫频时平均角度会偏 0.07–0.14 rad（11-23 日志）。
      # (中心 − 实测角度) 先按最低扫频频率的周期低通（freq_min 0.1 Hz → 10 s），再以此增益积分进偏移；0 关闭。
      # 不超调要求 gain ≤ 0.5 × freq_min（0.1 Hz 时 0.05）；0.03 约 1–2 分钟收敛。偏移仍受 max_correction 限制。
      sweep_correction_gain: 0.03 # 1/s
      # 扫频前的力矩余量检查（> 0 生效，0 不检查）：停稳末尾 |tau_link| 超过它，或参考偏移顶到 max_correction，
      # 就不扫频、直接平滑回起点，stop_code 5。驱动器约 80–85 N·m 饱和，托举 77–82 N·m 时扫频关节完全不动（11-23 日志）。
      max_hold_torque: 75.0       # N·m
      transfer_velocity: 0.3      # 起点 ↔ 水平位置移动的峰值速度 rad/s（五次多项式），约 10 s。
      min_transfer_time: 2.0
      enable_log: true
      log_file: /tmp/chirp_horizontal
      trj_out: Position
      # 运动范围放大到约 ±126°：水平中心 ±90° 再加幅值。启动时检查 起点、中心 ± 幅值 都在范围内，否则拒绝启动。
      # 机械限位和 URDF 的关节限位也要允许这个范围。
      position_min: -2.2
      position_max: 2.2
      # 按 7 kg@0.3 m、幅值 0.26 rad、1 Hz 估计：水平静态力矩约 21 N·m，加惯性力约 28 N·m；
      # 静态跟踪误差 21/98.7 ≈ 0.22 rad，加摩擦和无速度前馈的滞后约 0.55 rad。
      max_velocity: 4.0
      max_link_torque: 80.0       # 用户指定 80 N·m（为更重的配重留余量）。
      max_tracking_error: 1.0
      stop_motor_temperature: 70.0


  # 静态带载检查：依次平滑移动到 q0 + offsets[i]，每个位置保持 hold_time 并记录，全部测完回到 q0 后自动停止。
  # 用 `run_trj.sh trj_static ...` 启动，不要和其他轨迹插件同时打开。从配重自然下垂的位置开始（分析时把 q0 当作重力矩为零的角度）。
  trj_static:
    type: static_hold_plugin_haotian
    thread: rt_main
    params:
      mode: static
      joint: j_motor
      # 相对 q0 的偏移 rad：先正向逐级抬起再放回，再反向；同一角度从两侧各到一次，能看出静摩擦造成的滞回。可在线调。
      offsets: [0.0, 0.3, 0.6, 0.9, 1.2, 0.9, 0.6, 0.3, 0.0, -0.3, -0.6, -0.9, -1.2, -0.9, -0.6, -0.3, 0.0]
      hold_time: 8.0              # 每个位置保持 s，可在线调。
      settle_time: 2.0            # 保持段开头不计入平均的时长 s（等振荡衰减）。
      move_velocity: 0.3          # 移动段峰值速度 rad/s（五次多项式，起止平滑），可在线调。
      min_move_time: 1.0          # 移动段最短时长 s。
      velocity_feedforward: true  # 移动段下发解析速度作为速度参考（保持段为 0）；静态检查不涉及策略接口，用前馈跟踪更稳。
      position_min: -1.5707963267948966   # 绝对位置限 rad；q0 + offsets 超出时拒绝启动。
      position_max: 1.5707963267948966
      max_velocity: 1.0           # 实测速度上限 rad/s，须大于 move_velocity。
      max_link_torque: 30.0       # 输出端力矩阈值 N·m；配重 m*g*r 要明显小于它。
      max_tracking_error: 0.3     # |q - q_ref| 阈值 rad。
      stop_motor_temperature: 70.0  # 电机温度停机线 °C（暂定）；0 表示不检查。
      disable_reference_filter: true
      enable_log: true
      log_file: /tmp/static_hold

  # 移动到指定绝对角度后停住（与 trj_static 同一插件类型，mode: goto）：测试前把关节放到配重自然下垂的位置。
  # 用法：META=0 ./run_trj.sh goto target=<rad>。不要和其他轨迹插件同时打开。
  goto:
    type: static_hold_plugin_haotian
    thread: rt_main
    params:
      mode: goto
      joint: j_motor
      target: 0.0                 # 目标绝对位置 rad（输出端），可在线调。
      offsets: [0.0]              # goto 模式不用
      hold_time: 1.0              # 到位后再保持 s，然后插件停止，参考留在 target。
      settle_time: 0.5
      move_velocity: 0.2          # 峰值速度 rad/s（五次多项式，起止平滑）。
      min_move_time: 1.0
      velocity_feedforward: true
      # 范围和跟踪误差与 trj_horizontal 配套：水平测试中途停下时，用 goto target=0.0 从水平位置回到下垂
      # （7 kg@0.3 m 水平时静态跟踪误差约 0.22 rad + 静摩擦）。
      position_min: -2.2
      position_max: 2.2
      max_velocity: 1.0
      max_link_torque: 30.0
      max_tracking_error: 0.5
      stop_motor_temperature: 70.0
      disable_reference_filter: true
      enable_log: false
      log_file: /tmp/goto

  # 升温保温：输出端用 pin 固定（建议摆臂自然下垂时插 pin），位置模式下让参考偏离固定位置产生堵转力矩，
  # 温度 PID 调力矩（u = 加热功率比例，力矩 = max_torque·sqrt(u)），电机温度到 setpoint 后保温 soak_time，
  # 然后力矩按 torque_rate 降到 0、参考回到固定位置，插件自动停止并打印 "trj_heat DONE"，这时才能拔 pin。
  # 用法：./run_trj.sh trj_heat release_only=false setpoint=50 log_file=/tmp/heat_50C
  # 提前结束（会先释放力矩）：ros2 service call /xbotcore/set_parameter_values xbot_msgs/srv/SetString "{request: {/trj_heat/release: true}}"
  # 被外部停止（plugin switch 0、安全停机以外的情况）后参考可能还带偏移：先 ./run_trj.sh trj_heat release_only=true 释放，再拔 pin。
  # 注意：加热源是绕组，电机温度维持在 setpoint 时减速器稳态温度更低（热量经过外壳散到空气），
  # 减速器实际温度最好另用测温枪 / 热电偶读一下。
  trj_heat:
    type: thermal_soak_plugin_haotian
    thread: rt_main
    params:
      joint: j_motor
      # 可在启动命令里改（下次启动生效）：soak_time、tolerance、max_heat_time、max_torque、max_link_torque、torque_rate、kp、ki、kd、
      # release_only、log_file；setpoint 运行中也可改。其余项（direction、drive_stiffness、max_position_drift 等）改 yaml 后重启 xbot2-core。
      setpoint: 50.0              # 目标电机温度 °C，运行中可改。
      tolerance: 1.0              # 进入 setpoint ± tolerance 开始计保温时间 °C。
      soak_time: 1800.0           # 保温 s；0 表示一直保温，直到 release。
      max_heat_time: 1800.0       # 升温最长 s，超时说明力矩不够，自动释放（stop_code 5）；0 表示不限。
      # 堵转力矩上限 N·m（输出端）。铜损 = (力矩/50/Km)²，Km = 0.3634：30 N·m 约 2.7 W，60 N·m 约 11 W，88 N·m（额定）约 23.5 W。
      # 30 N·m 多半升不到 50 °C；确认力矩传感器、pin、减速器的量程后再往上调（堵转建议不超过额定的 60–70 %）。
      max_torque: 30.0
      direction: 1.0              # 力矩方向 +1 / -1。
      drive_stiffness: 98.7       # 驱动器位置环刚度 N·m/rad（2026-11-17 无负载扫频拟合），力矩 → 参考偏移。
      torque_rate: 2.0            # 力矩变化率上限 N·m/s，加载和释放都按它。
      kp: 0.2                     # 温度 PID：u 每 °C（差 5 °C 时满功率）。
      ki: 0.0003                  # 1/(°C·s)，积分时间约 kp/ki ≈ 11 min。
      kd: 0.0
      temperature_filter: 2.0     # 温度低通时间常数 s。
      torque_offset: 1.6          # 力矩传感器零偏 N·m，只用于安全检查和打印。
      max_link_torque: 40.0       # |tau_link - torque_offset| 阈值 N·m，必须大于 max_torque。
      max_position_drift: 0.05    # 输出端离开固定位置的阈值 rad（pin 松了或没装）。
      max_velocity: 0.5           # 实测速度阈值 rad/s。
      stop_motor_temperature: 70.0  # 电机温度停机线 °C，setpoint + tolerance 必须低于它。
      stop_driver_temperature: 0.0  # 驱动器温度停机线 °C，0 表示不检查。
      release_only: false         # true：只把上次留下的参考偏移释放到 0，不加热。用完改回 false。
      status_period: 10.0         # 状态行间隔 s。
      log_period: 0.1             # 日志每行间隔 s（升温日志不是训练数据，不用 1 kHz）。
      disable_reference_filter: true
      enable_log: true
      log_file: /tmp/heat


# global parameters
xbotcore_param:
  /xbot/hal/joint_safety/filter_autostart: false
  /xbot/hal/joint_safety/filter_cutoff_hz: 2.0






